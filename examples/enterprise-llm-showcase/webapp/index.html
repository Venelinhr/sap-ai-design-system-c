<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LLM design-system readiness — enterprise showcase (SAPUI5 only)</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #content {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        overflow: hidden;
      }
      #content .sapUiView,
      #content > * {
        height: 100%;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.core,sap.uxap"
      data-sap-ui-resourceroots='{"showcase": "./"}'
    ></script>
    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ui
          .core
          .mvc
          .XMLView.create({ viewName: "showcase.view.Showcase" })
          .then(function (oView) {
            oView.addStyleClass("sapUiViewHeight100");
            oView.addStyleClass("sapUiSizeCompact");
            oView.placeAt("content");
          });
      });
    </script>
  </head>
  <body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
  </body>
</html>
