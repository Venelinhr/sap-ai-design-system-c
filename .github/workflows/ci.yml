name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Build Registry
        run: make build-registry

      - name: Validate Registry
        run: make validate-registry

      - name: Test
        run: make test

      - name: Static visual token audit (deck / pitch)
        run: make token-audit

