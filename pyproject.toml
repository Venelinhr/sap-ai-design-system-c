[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-design-system-c"
version = "0.1.0"
description = "LLM-readable SAPUI5 design-system registry + Fiori demos (sap-ai-design-system-c)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "uvicorn>=0.30",
  "jsonschema>=4.22",
  "pyyaml>=6.0.1",
  "httpx>=0.27",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
]
case-study = [
  "python-pptx>=0.6.23",
  "fpdf2>=2.7.0",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Venelinhr/sap-ai-design-system-c"
Repository = "https://github.com/Venelinhr/sap-ai-design-system-c"

# Python import package remains `sapui5_llm_ready` (see src/sapui5_llm_ready/).

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]

