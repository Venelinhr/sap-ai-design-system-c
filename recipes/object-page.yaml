id: object-page
title: Object Page
description: Multi-section detail page with editable sections and semantic actions.
requiredComponents:
  - sap.uxap.ObjectPageLayout
  - sap.m.Button
optionalComponents:
  - sap.m.SimpleForm
  - sap.m.MessageStrip
tokenBindings:
  spacing.section: spacing.3
  color.accent.bg: color.primary.bg
accessibilityChecklist:
  - Ensure heading hierarchy reflects section structure.
  - Section anchors and tabs must be keyboard reachable.
  - Announce save/validation feedback using live regions where applicable.
uiSkeleton:
  type: app.objectPage
  regions:
    layout:
      type: sap.uxap.ObjectPageLayout
      children:
        - type: sap.uxap.ObjectPageSection
        - type: sap.uxap.ObjectPageSection
    footerActions:
      type: sap.m.OverflowToolbar
      children:
        - type: sap.m.Button
          props:
            text: Save
            type: Emphasized

