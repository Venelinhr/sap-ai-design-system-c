id: list-report
title: List Report
description: Table-centric enterprise page with filters and row actions.
requiredComponents:
  - sap.ui.comp.filterbar.FilterBar
  - sap.m.Table
optionalComponents:
  - sap.m.SearchField
  - sap.m.Button
tokenBindings:
  spacing.container: spacing.3
  color.header.bg: color.neutral.bg
accessibilityChecklist:
  - Ensure table headers are announced and sortable state is exposed.
  - Provide keyboard focus order: filter -> table -> actions.
  - Expose action labels with meaningful accessible names.
uiSkeleton:
  type: app.listReport
  regions:
    filters:
      type: sap.ui.comp.filterbar.FilterBar
    content:
      type: sap.m.Table
      children:
        - type: sap.m.ColumnListItem
    actions:
      type: sap.m.Toolbar
      children:
        - type: sap.m.Button
          props:
            text: Export

